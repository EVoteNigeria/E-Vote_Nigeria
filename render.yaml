services:
  - type: web
    name: evote-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VOTE_DB_PATH
        value: backend/evote.db
      - key: DATABASE_URL
        fromDatabase:
          name: evote-db
          property: connectionString

databases:
  - name: evote-db
    databaseName: evotedb
    user: evote_user
    plan: free
